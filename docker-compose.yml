services:
  db:
    image: postgres:16
    container_name: dataia_postgres
    restart: unless-stopped
    # Un vrai processus init (tini) en PID 1 récupère les processus orphelins :
    # sans lui, le postmaster est PID 1 et traite la mort d'un orphelin comme un plantage
    # (cf. docs/securite.md, incident du 2026-11-13).
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      # Utilisés par psql à l'intérieur du conteneur (scripts/*.ps1)
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      # Lus par sql/01_roles.sql (\getenv) pour définir les mots de passe des rôles
      IMMO_ADMIN_PASSWORD: ${IMMO_ADMIN_PASSWORD:?IMMO_ADMIN_PASSWORD manquant dans .env}
      ANALYST_RO_PASSWORD: ${ANALYST_RO_PASSWORD:?ANALYST_RO_PASSWORD manquant dans .env}
      APP_AGENT_PASSWORD: ${APP_AGENT_PASSWORD:?APP_AGENT_PASSWORD manquant dans .env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      # Timings d'I/O dans EXPLAIN (ANALYZE, BUFFERS) et pg_stat_statements
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./data/raw:/data/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataagent_backend
    restart: unless-stopped
    environment:
      APP_NAME: "AI Database Engineer API"
      APP_VERSION: "0.1.0"
      DEBUG: "${BACKEND_DEBUG:-false}"
      HOST: "0.0.0.0"
      PORT: "8000"
      # PostgreSQL - Connexion lecture seule (données immobilières)
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB manquant}"
      POSTGRES_USER_RO: "analyst_ro"
      POSTGRES_PASSWORD_RO: "${ANALYST_RO_PASSWORD:?ANALYST_RO_PASSWORD manquant}"
      # CORS origins
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      LOG_LEVEL: "INFO"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
