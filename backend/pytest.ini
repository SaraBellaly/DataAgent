[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personnalisés
markers =
    integration: tests d'intégration avec PostgreSQL réel
    unit: tests unitaires avec mocks
